
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Admin - Gym Management</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #2563eb);
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 380px;
      max-width: 92%;
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
    }

    h1 { text-align: center; color: #1e293b; }
    p { text-align: center; color: #64748b; }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .6; cursor: wait; }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>GYM MANAGEMENT</h1>
    <p>Đăng nhập quản trị hệ thống</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required
             autocomplete="username"
             placeholder="Nhập email">

      <label for="password">Mật khẩu</label>
      <input id="password" type="password" required
             autocomplete="current-password"
             placeholder="Nhập mật khẩu">

      <button id="loginBtn" type="submit">Đăng nhập</button>
      <div id="message" role="alert"></div>
    </form>
  </div>

  <script>
    const API_URL = "http://localhost:5000";

    document.getElementById("loginForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");
        const button = document.getElementById("loginBtn");

        message.textContent = "";
        button.disabled = true;

        try {
          const response = await fetch(API_URL + "/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
          });

          const result = await response.json();

          if (!response.ok || !result.accessToken) {
            throw new Error(result.message || "Đăng nhập thất bại");
          }

          sessionStorage.setItem("gym_access_token", result.accessToken);

          window.location.href = "./index.html";
        } catch (error) {
          message.textContent = error.message || "Không thể kết nối máy chủ";
        } finally {
          button.disabled = false;
        }
      });
  </script>
</body>
</html>
