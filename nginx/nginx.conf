
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # An thong tin phien ban Nginx
    server_tokens off;

    # Gioi han kich thuoc request
    client_max_body_size 10m;

    # Thoi gian cho ket noi
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

        # Chan truy cap cac file an va nhay cam
        location ~ /\.(?!well-known/) {
            deny all;
            return 404;
        }

        # Reverse Proxy Backend
        location /api/ {
            proxy_pass http://backend:5000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Frontend
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
